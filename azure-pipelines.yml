trigger:
  branches:
    include:
      - main
      - feature/*

pool:
  vmImage: ubuntu-latest

variables:
  terraformWebAppName: service-status-lab-romy01
  terraformResourceGroupName: rg-service-status-lab

stages:
  - stage: ValidateAndPlan
    displayName: Validate and plan
    jobs:
      - job: validate_and_plan
        displayName: Validate and plan
        steps:
          - task: UseDotNet@2
            displayName: Use .NET 10 SDK
            inputs:
              packageType: sdk
              version: 10.0.x

          - task: DotNetCoreCLI@2
            displayName: Run API tests
            inputs:
              command: test
              projects: tests/ServiceStatus.Api.Tests/ServiceStatus.Api.Tests.csproj
              arguments: --configuration Release
              publishTestResults: true

          - template: pipelines/templates/install-terraform.yml

          - bash: |
              set -euo pipefail

              terraform_bin="${AGENT_TEMPDIRECTORY}/terraform/terraform"

              "$terraform_bin" fmt -check -recursive
              "$terraform_bin" init -backend=false -input=false -lockfile=readonly
              "$terraform_bin" validate
            displayName: Validate Terraform configuration
            workingDirectory: infra/terraform

          - task: AzureCLI@2
            displayName: Plan Terraform infrastructure
            inputs:
              azureSubscription: sc-terraform-plan
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: infra/terraform
              inlineScript: |
                set -euo pipefail

                terraform_bin="${AGENT_TEMPDIRECTORY}/terraform/terraform"
                subscription_id="$(az account show --query id --output tsv)"

                "$terraform_bin" init -reconfigure -input=false -lockfile=readonly
                "$terraform_bin" plan -input=false -no-color -out=tfplan \
                  -var="subscription_id=${subscription_id}" \
                  -var="web_app_name=${{ variables.terraformWebAppName }}"

          - publish: infra/terraform/tfplan
            artifact: terraform-plan
            displayName: Publish reviewed Terraform plan
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

  - stage: Apply
    displayName: Apply Terraform after approval
    dependsOn: ValidateAndPlan
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: terraform_apply
        displayName: Apply approved Terraform plan
        environment: terraform-apply
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - template: pipelines/templates/install-terraform.yml

                - task: AzureCLI@2
                  displayName: Apply approved Terraform plan
                  inputs:
                    azureSubscription: sc-terraform-apply
                    scriptType: bash
                    scriptLocation: inlineScript
                    workingDirectory: infra/terraform
                    inlineScript: |
                      set -euo pipefail

                      terraform_bin="${AGENT_TEMPDIRECTORY}/terraform/terraform"

                      "$terraform_bin" init -reconfigure -input=false -lockfile=readonly
                      "$terraform_bin" apply -input=false -no-color "${PIPELINE_WORKSPACE}/terraform-plan/tfplan"

  - stage: PackageApplication
    displayName: Package application
    dependsOn: ValidateAndPlan
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: package_application
        displayName: Publish ASP.NET application artifact
        steps:
          - task: UseDotNet@2
            displayName: Use .NET 10 SDK
            inputs:
              packageType: sdk
              version: 10.0.x

          - task: DotNetCoreCLI@2
            displayName: Publish ASP.NET application
            inputs:
              command: publish
              projects: src/ServiceStatus.Api/ServiceStatus.Api.csproj
              arguments: --configuration Release --output $(Build.ArtifactStagingDirectory)/publish
              publishWebProjects: false
              zipAfterPublish: false

          - bash: |
              set -euo pipefail

              publish_root="$(Build.ArtifactStagingDirectory)/publish"
              package_dir="$(Build.ArtifactStagingDirectory)/package"
              runtime_config="$(find "$publish_root" -type f -name 'ServiceStatus.Api.runtimeconfig.json' -print -quit)"

              test -n "$runtime_config"
              publish_dir="$(dirname "$runtime_config")"

              rm -rf "$package_dir"
              mkdir -p "$package_dir"
              cp -R "$publish_dir"/. "$package_dir"/

              test -f "$package_dir/ServiceStatus.Api.dll"
              test -f "$package_dir/ServiceStatus.Api.runtimeconfig.json"
            displayName: Verify published application layout

          - task: ArchiveFiles@2
            displayName: Archive published application
            inputs:
              rootFolderOrFile: $(Build.ArtifactStagingDirectory)/package
              includeRootFolder: false
              archiveType: zip
              archiveFile: $(Build.ArtifactStagingDirectory)/service-status-api.zip
              replaceExistingArchive: true

          - publish: $(Build.ArtifactStagingDirectory)/service-status-api.zip
            artifact: app-package
            displayName: Publish application package

  - stage: DeployApplication
    displayName: Deploy application after approval
    dependsOn:
      - Apply
      - PackageApplication
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: application_deploy
        displayName: Deploy approved ASP.NET application
        environment: app-deploy
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: app-package

                - task: AzureCLI@2
                  displayName: Deploy application package to Web App
                  inputs:
                    azureSubscription: sc-terraform-apply
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail

                      az webapp deploy \
                        --resource-group "$(terraformResourceGroupName)" \
                        --name "$(terraformWebAppName)" \
                        --src-path "${PIPELINE_WORKSPACE}/app-package/service-status-api.zip" \
                        --type zip \
                        --clean true \
                        --async false
